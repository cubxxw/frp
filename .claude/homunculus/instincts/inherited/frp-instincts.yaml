# Frp Workflow Release Version Bump

## Action

Follow the release-version-bump workflow:
1. Update version in pkg/util/version/version.go (or utils/version/version.go in older structure).
2. Update README.md and README_zh.md with new version if needed.
3. Update Release.md.
4. Update go.mod and go.sum.
5. Update Makefile or Makefile.cross-compiles if needed.
6. Update configuration files (conf/frpc_full.ini, conf/frps_full.ini, etc.).
7. Update or add test files (test/e2e/, tests/ci/, etc.) as needed.
8. Update or touch main code files (client/, server/, cmd/, pkg/, etc.) as needed.
9. Update web assets if applicable (assets/frpc/static/, assets/frps/static/, web/frpc/, web/frps/).

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: pkg/util/version/version.go, README.md, README_zh.md

